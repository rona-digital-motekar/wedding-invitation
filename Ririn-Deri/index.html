<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4eee5">
<meta name="description" content="Undangan pernikahan Deri & Ririn">
<meta property="og:title" content="Deri & Ririn — Undangan Pernikahan">
<meta property="og:description" content="Dengan penuh syukur, kami mengundang Anda untuk hadir di hari bahagia kami.">
<title>Deri & Ririn — Undangan Pernikahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/style.css?v=20261001-fix3">
</head>
<body class="locked">

<!-- COVER: sengaja dipertahankan dari versi sebelumnya -->
<div id="gate" aria-label="Sampul undangan">
  <div class="gate-paper" aria-hidden="true"></div>
  <img class="gate-leaf gate-left" src="./assets/design/Elemen/Cover/Cover Left Animation.png" alt="">
  <img class="gate-leaf gate-right" src="./assets/design/Elemen/Cover/Cover Right Animation.png" alt="">
  <img class="gate-dove" src="./assets/design/Elemen/Cover/Merpati Icon in Opening.png" alt="">
  <img class="gate-stamp" src="./assets/design/Elemen/Cover/Stample in Cover.png" alt="">
  <div class="gate-content">
    <p class="eyebrow">The Wedding Of</p>
    <h1 class="gate-names" id="gateNames">Deri &amp; Ririn</h1>
    <p class="gate-to">Kepada Yth. Bapak/Ibu/Saudara/i</p>
    <p class="gate-guest" id="guestName">Tamu Undangan</p>
    <button class="primary-btn gate-open" id="openBtn" type="button">Buka Undangan</button>
  </div>
</div>

<main id="content">
  <!-- Halaman 1: full background, tanpa overlay HTML tambahan -->
  <section class="design-page page-home" id="home" aria-label="Pembuka">
    <img class="design-bg" src="./assets/background/Halaman 1.png" alt="">
  </section>

  <!-- Halaman 2: full background, tanpa overlay HTML tambahan -->
  <section class="design-page page-quote fade-page" id="quote" aria-label="Dengan Penuh Syukur">
    <img class="design-bg" src="./assets/background/Halaman 2.png" alt="">
  </section>

  <!-- Halaman 3: full background, tanpa overlay HTML tambahan -->
  <section class="design-page page-couple fade-page" id="couple" aria-label="Mempelai">
    <img class="design-bg" src="./assets/background/Halaman 3.png" alt="">
  </section>

  <!-- Countdown sengaja tetap dipertahankan setelah foto mempelai -->
  <section class="countdown-section" id="countdownSection" aria-label="Hitung mundur">
    <div class="countdown-wrap">
      <p class="countdown-kicker">MENUJU HARI BAHAGIA</p>
      <div class="countdown" aria-label="Hitung mundur menuju hari pernikahan">
        <div class="cd"><b id="dd">00</b><span>Hari</span></div>
        <div class="cd"><b id="hh">00</b><span>Jam</span></div>
        <div class="cd"><b id="mm">00</b><span>Menit</span></div>
        <div class="cd"><b id="ss">00</b><span>Detik</span></div>
      </div>
    </div>
  </section>

  <!-- Halaman 4: background desain + dua pasang tombol fungsional -->
  <section class="design-page page-event fade-page" id="event" aria-label="Acara">
    <img class="design-bg" src="./assets/background/Halaman 4.png" alt="">
    <div class="event-overlay" id="eventList" aria-label="Tombol acara"></div>
  </section>

  <!-- Gallery tetap ada, tetapi frame CSS lama dicopot. Foto nantinya bebas diganti dengan PNG buatan sendiri. -->
  <section class="gallery-section" id="gallery" aria-label="Galeri">
    <div class="gallery" id="galleryGrid"></div>
  </section>

  <!-- Halaman 5: background desain + form RSVP di area kosong -->
  <section class="design-page page-rsvp" id="rsvp" aria-label="RSVP">
    <img class="design-bg" src="./assets/background/Halaman 5.png" alt="">
    <div class="rsvp-overlay">
      <div class="form-card" id="rsvpCard">
        <form id="rsvpForm">
          <div class="field"><label for="rsvpName">Nama</label><input id="rsvpName" required maxlength="70" placeholder="Nama lengkap"></div>
          <div class="field"><label>Kehadiran</label><div class="choice-row" id="attendanceChoice"><button type="button" class="choice active" data-value="Hadir">Hadir</button><button type="button" class="choice" data-value="Ragu-ragu">Ragu-ragu</button><button type="button" class="choice" data-value="Tidak Hadir">Tidak Hadir</button></div></div>
          <div class="field"><label for="rsvpGuests">Jumlah tamu</label><input id="rsvpGuests" type="number" min="1" max="5" value="1"></div>
          <div class="field"><label for="rsvpNote">Catatan</label><textarea id="rsvpNote" maxlength="250" placeholder="Catatan opsional"></textarea></div>
          <button class="primary-btn form-submit" type="submit">Kirim Konfirmasi</button>
        </form>
      </div>
      <div class="success-box hidden" id="rsvpSuccess"><h4>Konfirmasi tersimpan</h4><p>Terima kasih. Sampai jumpa di hari bahagia kami.</p><button class="small-btn" id="editRsvp" type="button">Ubah jawaban</button></div>
    </div>
  </section>

  <!-- Halaman 6: komentar dibatasi dalam area scroll agar tidak pernah keluar frame -->
  <section class="design-page page-wishes" id="wishes" aria-label="Ucapan">
    <img class="design-bg" src="./assets/background/Halaman 6.png" alt="">
    <div class="wishes-overlay">
      <div class="wishes-list" id="wishList" aria-label="Kumpulan ucapan"></div>
      <div class="wish-form-card">
        <form id="wishForm">
          <div class="wish-fields">
            <input id="wishName" required maxlength="60" placeholder="Nama kamu" aria-label="Nama">
            <textarea id="wishMsg" required maxlength="300" placeholder="Tulis doa dan ucapan..." aria-label="Ucapan"></textarea>
          </div>
          <button class="primary-btn form-submit" type="submit">Kirim Ucapan</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Halaman 7: background desain + data rekening -->
  <section class="design-page page-gift" id="gift" aria-label="Amplop Digital">
    <img class="design-bg" src="./assets/background/Halaman 7.png" alt="">
    <div class="gift-overlay" id="giftGrid"></div>
  </section>

  <!-- Gallery tetap fungsional, tetapi diletakkan setelah halaman utama agar urutan background tidak rusak. -->
  <section class="gallery-section" id="gallery" aria-label="Galeri">
    <div class="gallery" id="galleryGrid"></div>
  </section>

  <!-- Footer: background saja, tanpa teks tambahan -->
  <footer id="footer" aria-label="Penutup">
    <img class="footer-bg" src="./assets/background/Footer.png" alt="">
  </footer>
</main>

<div id="lightbox" aria-hidden="true"><div class="lightbox-inner"><button class="icon-btn lightbox-close" id="lightboxClose" type="button" aria-label="Tutup">×</button><img id="lightboxImg" alt="Galeri"></div></div>
<div id="toast"></div>
<audio id="bgMusic" preload="auto" loop src="./music/wedding-nasyid.mp3"></audio>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<script src="./assets/js/firebase-config.js?v=20261001-fix3"></script>
<script src="./assets/js/app.js?v=20261001-fix3"></script>
</body>
</html>
