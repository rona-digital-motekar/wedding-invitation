<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8eee9">
<meta name="description" content="Undangan pernikahan Deri & Ririn">
<meta property="og:title" content="Deri & Ririn — Undangan Pernikahan">
<meta property="og:description" content="Dengan penuh syukur, kami mengundang Anda untuk hadir di hari bahagia kami.">
<title>Deri & Ririn — Undangan Pernikahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/style.css?v=20261001-final8">
</head>
<body class="locked">

<!-- COVER: visual panel tetap, tetapi interaksi memakai stempel. -->
<div id="gate" aria-label="Sampul undangan">
  <div class="gate-paper" aria-hidden="true"></div>
  <img class="gate-leaf gate-left" src="./assets/design/Elemen/Cover/Cover Left Animation.webp" alt="">
  <img class="gate-leaf gate-right" src="./assets/design/Elemen/Cover/Cover Right Animation.webp" alt="">
  <img class="gate-dove" src="./assets/design/Elemen/Cover/Merpati Icon in Opening.webp" alt="" aria-hidden="true">
  <div class="gate-content">
    <p class="gate-eyebrow">The Wedding Of</p>
    <h1 class="gate-names">Deri &amp; Ririn</h1>
    <button class="gate-stamp-button" id="openBtn" type="button" aria-label="Buka undangan dengan stempel">
      <img class="gate-stamp" src="./assets/design/Elemen/Cover/Stample in Cover.webp" alt="Stempel buka Undangan">
    </button>
    <div class="gate-recipient">
      <p class="gate-to">Kepada Yth. Bapak/Ibu/Saudara/i</p>
      <p class="gate-guest" id="guestName">Tamu Undangan</p>
    </div>
  </div>
</div>

<!-- Fixed bottom navigation: kabut tetap di bawah, konten di belakangnya blur. -->
<div class="scroll-fog">
  <nav class="section-dock" aria-label="Navigasi cepat">
    <a href="#event" data-nav-target="event"><span>Acara</span></a>
    <a href="#gallery" data-nav-target="gallery"><span>Galeri</span></a>
    <a href="#rsvp" data-nav-target="rsvp"><span>RSVP</span></a>
    <a href="#wishes" data-nav-target="wishes"><span>Ucapan</span></a>
    <a href="#gift" data-nav-target="gift"><span>Gift</span></a>
  </nav>
</div>
<main id="content">
  <!-- Halaman 1: background saja. -->
  <section class="design-page page-home reveal-page" id="home" aria-label="Pembuka" data-bg="1"></section>

  <!-- Halaman 2: background saja, fade-in. -->
  <section class="design-page page-quote reveal-page" id="quote" aria-label="Dengan Penuh Syukur" data-bg="2"></section>

  <!-- Halaman 3: background saja, fade-in. Countdown tetap di bawahnya. -->
  <section class="design-page page-couple reveal-page" id="couple" aria-label="Mempelai" data-bg="3"></section>

  <section class="countdown-section reveal-block" id="countdownSection" aria-label="Hitung mundur">
    <div class="countdown-wrap">
      <p class="countdown-kicker">Menuju Hari Bahagia</p>
      <div class="countdown" aria-label="Hitung mundur menuju hari pernikahan">
        <div class="cd"><b id="dd">00</b><span>Hari</span></div>
        <div class="cd"><b id="hh">00</b><span>Jam</span></div>
        <div class="cd"><b id="mm">00</b><span>Menit</span></div>
        <div class="cd"><b id="ss">00</b><span>Detik</span></div>
      </div>
    </div>
  </section>

  <!-- Halaman 4: background sudah memuat seluruh desain acara; HTML hanya tombol. -->
  <section class="design-page page-event reveal-page" id="event" aria-label="Acara">
    <div class="event-overlay" id="eventList" aria-label="Aksi acara"></div>
  </section>

  <!-- Gallery: foto tanpa frame tambahan. Frame akan disiapkan user kemudian. -->
  <section class="gallery-section reveal-block" id="gallery" aria-label="Galeri">
    <div class="gallery-head">
      <p>Moments</p>
      <h2>Galeri</h2>
    </div>
    <div class="gallery" id="galleryGrid"></div>
  </section>

  <!-- Halaman 5: background menyediakan panel kosong; tidak ada outer card duplikat. -->
  <section class="design-page page-rsvp reveal-page" id="rsvp" aria-label="RSVP">
    <div class="rsvp-overlay">
      <div class="form-card" id="rsvpCard">
        <form id="rsvpForm">
          <div class="field"><label for="rsvpName">Nama</label><input id="rsvpName" required maxlength="70" placeholder="Nama lengkap"></div>
          <div class="field"><label>Kehadiran</label><div class="choice-row" id="attendanceChoice"><button type="button" class="choice active" data-value="Hadir">Hadir</button><button type="button" class="choice" data-value="Ragu-ragu">Ragu-ragu</button><button type="button" class="choice" data-value="Tidak Hadir">Tidak Hadir</button></div></div>
          <div class="field"><label for="rsvpGuests">Jumlah tamu</label><input id="rsvpGuests" type="number" min="1" max="5" value="1"></div>
          <div class="field"><label for="rsvpNote">Catatan</label><textarea id="rsvpNote" maxlength="250" placeholder="Catatan opsional"></textarea></div>
          <button class="primary-btn form-submit" type="submit">Kirim Konfirmasi</button>
        </form>
      </div>
      <div class="success-box hidden" id="rsvpSuccess"><h4>Konfirmasi tersimpan</h4><p>Terima kasih. Sampai jumpa di hari bahagia kami.</p><button class="small-btn" id="editRsvp" type="button">Ubah jawaban</button></div>
    </div>
  </section>

  <!-- Halaman 6: background menyediakan panel putih; komentar dibatasi dan scroll internal. -->
  <section class="design-page page-wishes reveal-page" id="wishes" aria-label="Ucapan">
    <div class="wishes-overlay">
      <div class="wishes-list" id="wishList" aria-label="Kumpulan ucapan"></div>
      <div class="wish-form-card">
        <form id="wishForm">
          <div class="wish-fields">
            <input id="wishName" required maxlength="60" placeholder="Nama kamu" aria-label="Nama">
            <textarea id="wishMsg" required maxlength="300" placeholder="Tulis doa dan ucapan..." aria-label="Ucapan"></textarea>
          </div>
          <button class="primary-btn form-submit" type="submit">Kirim Ucapan</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Halaman 7: background + kartu BCA flip interaktif. -->
  <section class="design-page page-gift reveal-page" id="gift" aria-label="Amplop Digital">
    <div class="gift-overlay" id="giftGrid"></div>
  </section>

  <!-- Footer: background saja. -->
  <footer id="footer" class="reveal-block" aria-label="Penutup"></footer>
</main>

<div id="lightbox" aria-hidden="true"><div class="lightbox-inner"><button class="icon-btn lightbox-close" id="lightboxClose" type="button" aria-label="Tutup">×</button><img id="lightboxImg" alt="Galeri"></div></div>
<div id="toast"></div>
<audio id="bgMusic" preload="auto" loop src="./music/wedding-nasyid.mp3"></audio>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<script src="./assets/js/firebase-config.js?v=20261001-final3"></script>
<script src="./assets/js/app.js?v=20261001-final5"></script>
</body>
</html>
